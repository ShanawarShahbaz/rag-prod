# Google Cloud Build Configuration
# Automatically builds and deploys to Cloud Run

steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/job-applications:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/job-applications:$SHORT_SHA'
      - '.'
    id: 'build'

  # Step 2: Push to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/job-applications'
    id: 'push'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    args:
      - 'run'
      - '--filename=.'
      - '--image=gcr.io/$PROJECT_ID/job-applications:$SHORT_SHA'
      - '--location=us-central1'
      - '--output=/workspace/output'
    id: 'deploy'

# Alternative: Deploy directly using gcloud
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'job-applications'
      - '--image=gcr.io/$PROJECT_ID/job-applications:latest'
      - '--platform=managed'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--memory=512Mi'
      - '--timeout=3600s'
      - '--set-env-vars=JSEARCH_API_KEY=${_JSEARCH_API_KEY},GMAIL_ENABLED=true'

images:
  - 'gcr.io/$PROJECT_ID/job-applications:latest'
  - 'gcr.io/$PROJECT_ID/job-applications:$SHORT_SHA'

# Build triggers on git push
onFailure:
  - 'LOGGING'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'N1_HIGHCPU_8'
